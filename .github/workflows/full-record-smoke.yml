name: Single Known Booking Full Detail Test (private)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-detail-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      ARCHIVE_BACKEND: s3
      ARCHIVE_BUCKET: ${{ secrets.ARCHIVE_BUCKET }}
      ARCHIVE_ENDPOINT_URL: ${{ secrets.ARCHIVE_ENDPOINT_URL }}
      ARCHIVE_ACCESS_KEY_ID: ${{ secrets.ARCHIVE_ACCESS_KEY_ID }}
      ARCHIVE_SECRET_ACCESS_KEY: ${{ secrets.ARCHIVE_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Test full detail parser
        run: python -m pytest -q tests/test_full_record_parser.py
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Test one known booking and save full private detail
        run: python full_record_smoke.py
