name: Single Known Booking Live Test (private)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  known-record-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      ARCHIVE_BACKEND: s3
      ARCHIVE_RETENTION_DAYS: '730'
      ARCHIVE_BUCKET: ${{ secrets.ARCHIVE_BUCKET }}
      ARCHIVE_ENDPOINT_URL: ${{ secrets.ARCHIVE_ENDPOINT_URL }}
      ARCHIVE_ACCESS_KEY_ID: ${{ secrets.ARCHIVE_ACCESS_KEY_ID }}
      ARCHIVE_SECRET_ACCESS_KEY: ${{ secrets.ARCHIVE_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Test one known public booking URL and save one private record
        run: python live_record_smoke.py
